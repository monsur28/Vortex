<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Live - Premium IPTV Player</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- HLS.js for m3u8 streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="app-container" id="app-container">
        <!-- LEFT: Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg class="logo-icon-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width: 28px; height: 28px; filter: drop-shadow(0 0 6px rgba(124, 58, 237, 0.4));">
                        <defs>
                            <linearGradient id="vortexGradSidebar" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#a855f7" />
                                <stop offset="100%" stop-color="#6366f1" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="40" stroke="url(#vortexGradSidebar)" stroke-width="12" stroke-dasharray="180 60" fill="none" stroke-linecap="round" />
                        <circle cx="50" cy="50" r="20" fill="url(#vortexGradSidebar)" />
                    </svg>
                    <span>VORTEX</span>
                </div>
            </div>

            <nav class="categories-nav">
                <div class="section-title">
                    <span>CATEGORIES</span>
                </div>
                <ul class="categories-list" id="categories-list">
                    <!-- Dynamic categories list here -->
                </ul>
            </nav>

            <div class="sidebar-footer">
                <p>Vortex Player v1.0.0</p>
            </div>
        </aside>

        <!-- MAIN: Content Area (Header + Body) -->
        <main class="main-content">
            <!-- Header Bar -->
            <header class="app-header">
                <div class="header-left">
                    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Sidebar">
                        <i data-lucide="menu"></i>
                    </button>
                    <div class="current-view-info">
                        <h1 id="current-category-title">Bangla</h1>
                        <span class="badge" id="channel-count-badge">0 Channels</span>
                    </div>
                </div>

                <div class="header-actions">
                    <div class="search-box" id="header-search-box">
                        <i data-lucide="search" class="search-icon"></i>
                        <input type="text" id="search-input" placeholder="Search channels..." autocomplete="off">
                        <button class="clear-search" id="clear-search" style="display: none;">
                            <i data-lucide="x"></i>
                        </button>
                    </div>

                    <button class="fav-toggle-btn" id="fav-toggle-btn" title="Show Bookmarked">
                        <i data-lucide="star"></i>
                        <span>Favorites</span>
                    </button>
                </div>
            </header>

            <!-- Horizontal Categories Bar for Mobile -->
            <div class="mobile-categories-bar" id="mobile-categories-bar">
                <!-- Dynamic categories list as chips/pills -->
            </div>

            <!-- Content Body: Player (middle) + Channel Grid (right) -->
            <div class="content-body" id="content-body">
                <!-- MIDDLE: Player Panel (shown when playing) -->
                <aside class="player-panel" id="player-panel">
                    <div class="panel-header">
                        <h2>Now Streaming</h2>
                        <button class="close-panel" id="close-panel" aria-label="Close Player">
                            <i data-lucide="x"></i>
                        </button>
                    </div>

                    <div class="player-container">
                        <div class="video-wrapper">
                            <video id="video-player" playsinline></video>
                            <!-- Custom Player Controls overlay -->
                            <div class="player-controls" id="player-controls">
                                <div class="controls-progress">
                                    <div class="progress-bar">
                                        <div class="progress-filled"></div>
                                    </div>
                                </div>
                                <div class="controls-row">
                                    <div class="controls-left">
                                        <button class="play-btn" id="play-btn">
                                            <i data-lucide="play" class="icon-play"></i>
                                            <i data-lucide="pause" class="icon-pause" style="display:none;"></i>
                                        </button>
                                        <div class="volume-container">
                                            <button class="volume-btn" id="volume-btn">
                                                <i data-lucide="volume-2" class="icon-vol-up"></i>
                                                <i data-lucide="volume-x" class="icon-vol-mute"
                                                    style="display:none;"></i>
                                            </button>
                                            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1"
                                                step="0.05" value="1">
                                        </div>
                                        <span class="time-display">Live Stream</span>
                                    </div>
                                    <div class="controls-right">
                                        <button class="pip-btn" id="pip-btn" title="Picture in Picture">
                                            <i data-lucide="external-link"></i>
                                        </button>
                                        <button class="theater-btn" id="theater-btn" title="Theater Mode">
                                            <i data-lucide="monitor"></i>
                                        </button>
                                        <button class="fullscreen-btn" id="fullscreen-btn" title="Fullscreen">
                                            <i data-lucide="maximize"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <!-- Buffering Indicator Overlay -->
                            <div class="player-overlay" id="player-buffering" style="display: none;">
                                <div class="spinner"></div>
                                <p>Connecting stream...</p>
                            </div>
                            <!-- Offline/Error Overlay -->
                            <div class="player-overlay error-overlay" id="player-error" style="display: none;">
                                <i data-lucide="wifi-off"></i>
                                <p id="player-error-text">Stream Offline or Load Failed</p>
                            </div>
                        </div>
                    </div>

                    <div class="active-channel-details" id="active-channel-details">
                        <div class="channel-main-info">
                            <img src="" alt="" class="active-channel-logo" id="active-channel-logo"
                                onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\' fill=\'%23ffffff\'><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'40\'>TV</text></svg>';">
                            <div>
                                <h3 id="active-channel-name">Select a Channel</h3>
                                <p id="active-channel-group">Choose from the feed to begin streaming</p>
                            </div>
                        </div>
                        <div class="channel-actions">
                            <button class="star-btn" id="active-star-btn">
                                <i data-lucide="star"></i>
                                <span>Add to Favorites</span>
                            </button>
                        </div>
                    </div>
                </aside>

                <!-- RIGHT: Channels Feed (always visible, scrollable) -->
                <section class="feed-section" id="feed-section">
                    <!-- FIFA World Cup 2026 Hub -->
                    <div id="world-cup-hub" class="world-cup-hub" style="display: none;"></div>

                    <div class="channels-grid" id="channels-grid">
                        <!-- Dynamic channel cards here -->
                    </div>
                    <div class="empty-state" id="empty-state" style="display: none;">
                        <i data-lucide="alert-circle" class="empty-icon"></i>
                        <h3>No channels found</h3>
                        <p>Try refining your search query or choosing another category.</p>
                    </div>
                </section>
            </div>
        </main>

        <!-- Mobile Bottom Navigation -->
        <nav class="mobile-bottom-nav">
            <button class="nav-item active" id="nav-home">
                <i data-lucide="home"></i>
                <span>Home</span>
            </button>
            <button class="nav-item" id="nav-categories-btn">
                <i data-lucide="grid"></i>
                <span>Categories</span>
            </button>
            <button class="nav-item" id="nav-search-btn">
                <i data-lucide="search"></i>
                <span>Search</span>
            </button>
            <button class="nav-item" id="nav-favs-btn">
                <i data-lucide="star"></i>
                <span>Bookmarks</span>
            </button>
        </nav>

        <!-- Drawer/Bottom Sheet for Categories selector on Mobile -->
        <div class="bottom-sheet" id="categories-sheet">
            <div class="bottom-sheet-backdrop" id="sheet-backdrop"></div>
            <div class="bottom-sheet-content">
                <div class="bottom-sheet-header">
                    <div class="sheet-handle"></div>
                    <h3>Select Category</h3>
                </div>
                <div class="bottom-sheet-body">
                    <ul class="categories-list-mobile" id="categories-list-mobile">
                        <!-- Dynamic list of categories with counts -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Entry -->
    <script type="module" src="/app.js"></script>
</body>

</html>
