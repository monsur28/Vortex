<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glowing background ring -->
  <circle cx="100" cy="100" r="80" stroke="rgba(0, 223, 137, 0.1)" stroke-width="12" />
  
  <!-- Animated loading ring -->
  <circle cx="100" cy="100" r="80" stroke="#00df89" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 500" stroke-dashoffset="0">
    <animate attributeName="stroke-dasharray" values="1, 500; 250, 500; 1, 500" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke-dashoffset" values="0; -60; -500" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Inner pulse -->
  <circle cx="100" cy="100" r="30" fill="#00df89" opacity="0.5">
    <animate attributeName="opacity" values="0.2; 0.8; 0.2" dur="1s" repeatCount="indefinite" />
    <animate attributeName="r" values="25; 40; 25" dur="1s" repeatCount="indefinite" />
  </circle>
</svg>
